/* ── announcements ── */
function say(msg, urgent) {
  const el = urgent ? $('#liveAssert') : $('#livePolite');
  el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 40);
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('aria-hidden', 'true');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600); say(msg);
}

/* ── time helpers ── */
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(S.lang === 'es' ? 'es-US' : 'en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase();
const fmtDate = (ts) => new Date(ts).toLocaleDateString(S.lang === 'es' ? 'es-US' : 'en-US', { weekday: 'short', day: 'numeric', month: 'short' });
function reviewDay() {
  const d = new Date(); do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return d.toLocaleDateString(S.lang === 'es' ? 'es-US' : 'en-US', { weekday: 'long' });
}

/* ── steps ── */
const skipWho = () => S.returning && !S.editProfile;
function stepOf(scr) {
  const seq = skipWho() ? ['where', 'what', 'access'] : ['where', 'who', 'what', 'access'];
  const i = seq.indexOf(scr === 'notlisted' ? 'where' : scr);
  return i < 0 ? null : [i + 1, seq.length];
}

/* ── persistence ── */
function saveDraft() {
  if (['emergency', 'call', 'done'].includes(S.screen)) return;
  store.set('draft', { d: S.d, screen: S.screen === 'maybe' ? 'what' : S.screen, at: Date.now(), returning: S.returning, editProfile: S.editProfile, photosPending: S.photos.filter((p) => p.status !== 'done').length });
}

/* ── rendering ── */
function head(title, scr) {
  const st = stepOf(scr);
  return `${st ? `<p class="step" id="stepText">${esc(L().step(st[0], st[1]))}</p>` : ''}<h1 tabindex="-1" ${st ? 'aria-describedby="stepText"' : ''}>${esc(title)}</h1>`;
}
function errLine(id, msg) { return msg ? `<p class="err" id="${id}-err">${ICON.alert}<span>${esc(msg)}</span></p>` : ''; }
function radios(name, labels, val, legend, opts = {}) {
  const e = S.errors[name];
  return `<fieldset class="field" ${e ? 'aria-invalid="true"' : ''} ${e ? `aria-describedby="${name}-err"` : ''}>
    <legend>${esc(legend)}</legend>
    <div class="pills" role="radiogroup">${labels.map((lab, i) => `
      <label class="pill"><input type="radio" name="${name}" value="${i}" ${String(val) === String(i) ? 'checked' : ''} data-k="${name}" ${i === 0 ? `id="f-${name}"` : ''}><span>${esc(lab)}</span></label>`).join('')}
    </div>${errLine(name, e)}${opts.after || ''}</fieldset>`;
}
function input(k, label, attrs = '', hint = '', optional = false) {
  const e = S.errors[k];
  const desc = [hint ? `${k}-hint` : '', e ? `${k}-err` : ''].filter(Boolean).join(' ');
  return `<div class="field"><label class="label" for="f-${k}">${esc(label)}${optional ? ` <span class="opt">${esc(L().opt)}</span>` : ''}</label>
    <input class="input" id="f-${k}" data-k="${k}" value="${esc(S.d[k])}" ${attrs} ${e ? 'aria-invalid="true"' : ''} ${desc ? `aria-describedby="${desc}"` : ''}>
    ${errLine(k, e)}${hint ? `<p class="hint" id="${k}-hint">${esc(hint)}</p>` : ''}</div>`;
}

function upload(p) {

    if (idx > 0) say(p.status === 'done' ? L().q24(idx) : L().q18(1));

/* ── validation ── */
function validate(scr) {
  const l = L(), d = S.d, e = {};
  if (scr === 'where' && !(S.returning && !S.editProfile)) {
    if (!d.code && !d.freeName) e.code = l.w10;
    if (!d.apt.trim()) e.apt = l.w11;
  }
  if (scr === 'notlisted' && !d.freeName.trim()) e.freeName = l.w8;
  if (scr === 'who') {
    if (!d.name.trim()) e.name = l.h6;
    let digits = d.cell.replace(/\D/g, ''); if (digits.length === 11 && digits[0] === '1') digits = digits.slice(1);
    if (!digits) e.cell = l.h7; else if (digits.length !== 10) e.cell = l.h8(digits.length);
  }
  if (scr === 'what') {
    if (d.cat === '') e.cat = l.q22;
    if (d.where === '') e.where = l.q23;
    if (!d.desc.trim()) e.desc = l.q20;
    if (d.long === '') e.long = l.q23;
    if (d.worse === '') e.worse = l.q23;
  }
  if (scr === 'access') {
    if (d.entry === '') e.entry = l.a11;
    if (String(d.entry) === '1' && !d.times.length) e.times = l.a12;
    if (d.pets === '') e.pets = l.q23;
  }
  S.errors = e;
  const first = Object.keys(e)[0];
  if (first) { render('#f-' + first); return false; }
  return true;
}
function matchWords(text) {
  const t = ' ' + text.toLowerCase().replace(/[^\p{L}\s]/gu, ' ') + ' ';
  const hits = EMERGENCY_WORDS.filter((w) => t.includes(' ' + w + ' '));
  return hits.filter((w) => !hits.some((o) => o !== w && o.includes(w)));
}

/* ── sending ── */
function renderSend() {
  const foot = $('#sendFoot'), note = $('#sendNote'); if (!foot) return; const l = L();
  const pending = S.photos.filter((p) => p.status === 'uploading').length;
  let label = l.s1;
  if (S.sending) label = S.sendNote === 'slow' ? l.s3 : pending ? l.s2(pending) : (S.sendNote === 'retry' ? l.sendingNow : l.sending);
  foot.innerHTML = `<button class="btn btn-primary" data-act="send" ${S.sending ? 'disabled' : ''}>${S.sending ? '<span class="spinner" aria-hidden="true"></span>' : ''}${esc(label)}</button>`;
  note.innerHTML = S.attempts && !S.sending
    ? `<div class="note alert" role="alert">${ICON.alert}<p>${esc(l.notSentNoSignal)}${S.attempts >= 3 ? `<br><br>${esc(l.stillFailing)}<br><button class="btn btn-secondary" style="margin-top:8px" data-act="copy">${esc(l.copyMine)}</button>` : ''}</p></div>` : '';
}
function send(isRetry) {
  if (S.sending) return;
  S.sending = true; S.sendNote = isRetry ? 'retry' : ''; renderSend();
  const started = Date.now();
  const slow = setTimeout(() => { S.sendNote = 'slow'; renderSend(); say(L().s3); }, 10000);
  const finish = () => {
    clearTimeout(slow); S.sending = false;
    if (S.offline) {
      S.attempts++; store.set('unsent', { d: S.d, at: Date.now() }); renderSend();
      say(S.attempts >= 3 ? L().stillFailing : L().notSentNoSignal, true);
      return;
    }
    S.photos.forEach((p) => { if (p.status === 'uploading') p.status = 'failed'; });
    const num = window.PEI_nextNum ? window.PEI_nextNum() : 'HR-' + (1040 + Math.floor(Math.random() * 900));
    S.result = { num, prop: propName() };
    store.set('last', { num, cat: S.d.cat, at: Date.now() });
    window.PEI_addRequest?.(Object.assign({}, S.d, {
      num, at: Date.now(), lang: S.lang,
      photos: S.photos.filter((p) => p.status === 'done').length,
      photosMissing: S.photos.filter((p) => p.status === 'failed').length,
      possibleEmergency: S.maybeDone ? S.matched : '',
    }));
    store.set('profile', { code: S.d.code, freeName: S.d.freeName, freeCity: S.d.freeCity, apt: S.d.apt, name: S.d.name, cell: S.d.cell, site: S.d.site });
    store.del('draft'); store.del('unsent');
    S.attempts = 0; S.history = []; S.screen = 'done'; render();
  };
  const tick = () => {
    const waiting = S.photos.some((p) => p.status === 'uploading') && Date.now() - started < 30000;
    if (waiting) { renderSend(); setTimeout(tick, 400); } else setTimeout(finish, 900);
  };
  tick();
}
function copyText() {
  const l = L(), d = S.d;
  const ans = (arr, v) => (v === '' ? '' : arr[v]);
  return `${l.copyHead}: ${propName()}, ${l.aptPrefix.toLowerCase()} ${d.apt}. ${ans(l.cats, d.cat)}: ${d.desc} ${l.started}: ${ans(l.longs, d.long)}. ${l.worse}: ${ans(l.worses, d.worse)}. ${l.enter}: ${ans(l.yesno, d.entry)}. ${l.there}: ${d.times.map((i) => l.times[i]).join(', ') || '—'}. ${l.petsL}: ${ans(l.pets, d.pets)}${d.petOther ? ' (' + d.petOther + ')' : ''}. ${d.name}, ${d.cell}.`;

/* ── actions ── */
function act(a, el) {
  const l = L();
  switch (a) {
    case 'emerg': S.tapped = +el.dataset.i; go('call'); break;
    case 'none': go('where'); break;
    case 'call': toast(l.demoCall); break;
    case 'notEmerg': { const i = S.tapped; S.history = []; S.screen = 'emergency'; render(`[data-act="emerg"][data-i="${i}"]`); break; }
    case 'pick': openSheet(); break;
    case 'closeSheet': closeSheet(); break;
    case 'choose': S.d.code = el.dataset.code; S.d.freeName = ''; S.d.freeCity = ''; S.qrUnknown = false; S.fromQR = false; delete S.errors.code; closeSheet(); render('#f-code'); saveDraft(); break;
    case 'notListed': closeSheet(); S.d.code = ''; go('notlisted'); break;
    case 'notlistedNext': if (validate('notlisted')) { S.history.pop(); S.screen = 'where'; S.errors = {}; render('#f-apt'); saveDraft(); } break;
    case 'editProfile': S.editProfile = true; render('#f-apt'); break;
    case 'next': {
      const order = skipWho() ? { where: 'what', what: 'access' } : { where: 'who', who: 'what', what: 'access' };
      if (!validate(S.screen)) break;
      if (S.screen === 'what' && !S.maybeDone) {
        const hits = matchWords(S.d.desc);
        if (hits.length) { S.matched = hits.join(', '); go('maybe'); break; }
      }
      go(order[S.screen]); break;
    }
    case 'maybeContinue': S.maybeDone = true; S.history.pop(); S.history.push('what'); S.screen = 'access'; S.errors = {}; render(); saveDraft(); break;
    case 'addPhoto': $('#fileIn').click(); break;
    case 'removePhoto': { const i = +el.dataset.i; S.photos.splice(i, 1); renderPhotos(); const nx = $(`[data-act="removePhoto"][data-i="${Math.min(i, S.photos.length - 1)}"]`) || $('[data-act="addPhoto"]'); nx && nx.focus(); break; }
    case 'retryPhoto': upload(S.photos[+el.dataset.i]); break;
    case 'send': if (validate('access')) send(false); break;
    case 'copy': {
      const txt = copyText();
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(l.copied), () => {
        const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast(l.copied); } catch {} ta.remove();
      });
      break;
    }
    case 'resendPhotos': S.photos.forEach((p) => { if (p.status === 'failed') p.status = 'done'; }); render(); toast(l.photosSent); break;
    case 'another': {
      const keep = { code: S.d.code, freeName: S.d.freeName, freeCity: S.d.freeCity, apt: S.d.apt, name: S.d.name, cell: S.d.cell, site: S.d.site };
      S.d = Object.assign(blank(), keep); S.photos = []; S.maybeDone = false; S.returning = true; S.editProfile = false; S.fromQR = false; S.history = [];
      go('emergency', false); break;
    }
    case 'resume': {
      const saved = store.get('draft'); $('#dlg').close();
      if (saved) { S.d = Object.assign(blank(), saved.d); S.returning = !!saved.returning; S.editProfile = !!saved.editProfile; S.history = ['emergency']; go(saved.screen, false); }
      break;
    }
    case 'startOver': store.del('draft'); $('#dlg').close(); begin(true); break;
    case 'sendUnsent': {
      const saved = store.get('unsent'); $('#dlg').close();
      S.d = Object.assign(blank(), saved.d); S.history = []; S.screen = 'access'; render(); send(true); break;
    }
    case 'deleteUnsent': store.del('unsent'); $('#dlg').close(); begin(true); break;
  }
}

    <div><h2 tabindex="-1" id="qTitle"><span class="num">${esc(r.num)}</span> · Apartment ${esc(r.apt)}</h2><p class="hint" style="margin-top:4px">${esc(pname(r))}</p></div>
    <div class="chips"><span class="chip-s status">${esc(r.status)}</span>${r.example ? '<span class="chip-s">Example</span>' : ''}</div>
    ${r.possibleEmergency && isOpen(r) ? `<div class="note alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v4" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1" fill="currentColor"/></svg><p><strong>Possible emergency</strong>The worker wrote "${esc(r.possibleEmergency)}" and chose to send it anyway. Call ${esc(r.name.split(' ')[0])} at ${esc(r.cell)} before anything else.</p></div>` : ''}
    ${d ? `<div class="note"><p><strong>Same apartment and problem as ${esc(d.num)}</strong>${esc(d.name)} reported it ${esc(ago(d.at))}. Merge this one instead of forwarding it twice.</p></div>` : ''}
    <div class="q-actions">${actions}</div>${pan}
    <div><p class="sec">Request</p>${facts}</div>${contact}
    <div><p class="sec">History</p><ol class="log">${r.log.slice().reverse().map((l) => `<li>${esc(when(l.at))} — ${esc(l.text)}</li>`).join('')}</ol></div>`;
}

function render(focusTitle) {
  const host = $('#queueView'); if (host.hidden) return;
  const L = lists();
  const items = view === 'triage' ? L.triage : view === 'waiting' ? L.waiting : L.all;
  const r = Q.find((x) => x.id === sel);
  let listHtml;
  if (view === 'all') {
    listHtml = ['New', 'Needs Info', 'Sent to Property', 'Fixed', 'Closed', 'Duplicate'].map((s) => {
      const g = Q.filter((x) => x.status === s).sort((a, b) => b.at - a.at); if (!g.length) return '';
      return `<p class="q-group">${esc(s)}</p>${g.map(row).join('')}`;
    }).join('');
  } else listHtml = items.map(row).join('') || `<p class="q-empty">${view === 'triage' ? 'Nothing new. Requests from the form land here.' : 'Nothing waiting on a property.'}</p>`;
  host.innerHTML = `<div class="q-head"><h1>Maintenance requests</h1>
      <label for="meSel">Working as <select id="meSel"><option ${me === 'Tonya' ? 'selected' : ''}>Tonya</option><option ${me === 'Jordan' ? 'selected' : ''}>Jordan</option></select></label></div>
    <div class="q-tabs" role="tablist" aria-label="Views">
      <button class="q-tab" role="tab" aria-selected="${view === 'triage'}" data-q="view" data-v="triage">Triage today<span class="q-count">${L.triage.length}</span></button>
      <button class="q-tab" role="tab" aria-selected="${view === 'waiting'}" data-q="view" data-v="waiting">Waiting on property<span class="q-count">${L.waiting.length}</span></button>
      <button class="q-tab" role="tab" aria-selected="${view === 'all'}" data-q="view" data-v="all">All requests</button>
    </div>
    <div class="q-grid ${r ? 'has-sel' : ''}"><div class="q-list">${listHtml}</div><div class="q-detail">${detail(r)}</div></div>`;
  if (focusTitle && $('#qTitle')) $('#qTitle').focus();
}
function update(r, status, text) { r.status = status; r.log.push({ at: Date.now(), text }); save(); }
function say(m) { const el = $('#livePolite'); el.textContent = ''; setTimeout(() => { el.textContent = m; }, 40); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; t.setAttribute('aria-hidden', 'true'); document.body.appendChild(t); setTimeout(() => t.remove(), 2600); say(m); }

$('#queueView').addEventListener('click', (e) => {
  const el = e.target.closest('[data-q]'); if (!el) return;
  const r = Q.find((x) => x.id === sel);
  switch (el.dataset.q) {
    case 'view': view = el.dataset.v; sel = null; panel = null; render(); break;
    case 'open': sel = el.dataset.id; panel = null; render(true); break;
    case 'back': sel = null; panel = null; render(); break;
    case 'panel': panel = el.dataset.p; render(); break;
    case 'cancel': panel = null; render(); break;
    case 'assign': { const v = $('#assign').value; if (!v) return; r.code = v; r.log.push({ at: Date.now(), text: `Matched "${r.freeName}" to ${propOf(r).name}` }); save(); panel = 'forward'; render(); break; }
    case 'markSent': {
      const m = el.dataset.m; let extra = '';
      if (m === 'Phone') { const who = $('#spoke').value.trim(), wo = $('#wo').value.trim(); extra = (who ? `, spoke to ${who}` : '') + (wo ? `, work order ${wo}` : ''); }
      r.sentAt = Date.now(); r.sentMethod = m;
      update(r, 'Sent to Property', `Sent to property by ${m.toLowerCase()} (${me})${extra}`);
      panel = 'text:sent:'; render(); toast(`${r.num} marked Sent to Property`); break;
    }
    case 'markNeeds': {
      const i = +($('input[name="miss"]:checked')?.value ?? 2); const m = MISSING[i];
      update(r, 'Needs Info', `Needs Info: ${m.label.toLowerCase()} (${me})`);
      panel = 'text:needs:' + (r.lang === 'es' ? m.es : m.en); render(); toast(`${r.num} marked Needs Info`); break;
    }
    case 'merge': { const d = dupOf(r); update(r, 'Duplicate', `Merged into ${d.num} (${me})`); d.log.push({ at: Date.now(), text: `${r.num} from ${r.name} merged into this request` }); save(); sel = d.id; panel = null; render(true); toast(`Merged into ${d.num}`); break; }
    case 'setDate': { const i = +$('#day').value; r.log.push({ at: Date.now(), text: `Property gave a date: ${DAYS.en[i]} (${me})` }); save(); panel = 'text:date:' + (r.lang === 'es' ? DAYS.es[i] : DAYS.en[i]); render(); break; }
    case 'followSent': r.log.push({ at: Date.now(), text: `Followed up by email (${me})` }); save(); panel = null; render(); toast('Follow-up sent'); break;
    case 'status': {
      const s = el.dataset.s;
      update(r, s, { New: 'Back to triage', Fixed: 'Marked fixed', Closed: 'Closed', 'Sent to Property': 'Not fixed — back to waiting on property' }[s] + ` (${me})`);
      if (s === 'Sent to Property') r.sentAt = r.sentAt || Date.now();
      panel = null; render(); toast(`${r.num}: ${s}`); break;
    }
    case 'copy': {
      const txt = $('#' + el.dataset.src).textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied'), () => {
        const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); toast('Copied'); } catch {} ta.remove();
      });
      break;
    }
  }
});
$('#queueView').addEventListener('change', (e) => { if (e.target.id === 'meSel') { me = e.target.value; render(); } });

/* ── demo view switcher ── */
function show(v) {
  const q = v === 'queue';
  $('#queueView').hidden = !q; $('#formView').hidden = q;
  $('#tabQueue').setAttribute('aria-selected', String(q)); $('#tabForm').setAttribute('aria-selected', String(!q));
  try { history.replaceState(null, '', q ? '#queue' : location.pathname + location.search); } catch {}
  if (q) { Q = ls.get() || Q; render(); } else window.PEI_formRender?.();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.seg [data-view]').forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));
if (!ls.get()) save();
if (location.hash === '#queue') show('queue');
})();
</script>
