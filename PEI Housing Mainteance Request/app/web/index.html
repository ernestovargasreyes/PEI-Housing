<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Maintenance request</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div class="banner" id="banner" hidden></div>
  <header class="bar">
    <button class="iconbtn" id="backBtn" hidden><span class="sr" id="backLabel">Back</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <span class="title" id="appTitle">Maintenance request</span>
    <button class="langbtn" id="langBtn" lang="es">Español</button>
  </header>
  <div class="signal" id="signalBar" role="status" hidden></div>
  <main id="app"><noscript><div class="body"><p>This form needs JavaScript. Text your maintenance problem to the housing office instead.</p></div></noscript></main>
</div>
<div class="sr" aria-live="polite" id="livePolite"></div>
<div class="sr" aria-live="assertive" id="liveAssert"></div>
<dialog id="dlg"></dialog>
<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
